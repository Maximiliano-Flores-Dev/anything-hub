name: Build Flutter APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          cache: true

      - name: Ensure Android Native Structure Exists
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name anything_hub --org com.anything.hub --platforms=android
          fi

      - name: Patch Flutter Groovy Compatibility Error
        run: |
          # Localizamos y parchamos el archivo flutter.groovy en el toolchain de Flutter para evitar el error de QName
          FLUTTER_GROOVY_PATH=$(find $HOME/flutter -name "flutter.groovy" 2>/dev/null || find /opt/hostedtoolcache/flutter -name "flutter.groovy" 2>/dev/null)
          if [ -f "$FLUTTER_GROOVY_PATH" ]; then
            echo "Patching $FLUTTER_GROOVY_PATH"
            sed -i 's/import groovy.xml.QName//g' "$FLUTTER_GROOVY_PATH"
          else
            echo "Flutter groovy file not found via find, checking standard toolcache..."
            # Ruta alternativa común en GitHub Actions runners
            ALT_PATH="/opt/hostedtoolcache/flutter/stable-3.29.0-x64/flutter/packages/flutter_tools/gradle/src/main/groovy/flutter.groovy"
            if [ -f "$ALT_PATH" ]; then
              sed -i 's/import groovy.xml.QName//g' "$ALT_PATH"
              echo "Patched successfully at alternative path."
            fi
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Split APKs Release
        run: flutter build apk --release --split-per-abi

      - name: Upload Split APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-release-abis
          path: build/app/outputs/flutter-apk/*.apk
          
