name: Build and Release Flutter APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17' # Requerido por Gradle moderno

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'
          cache: true

      - name: Ensure Android Native Structure Exists
        run: |
          if [ ! -d "android" ]; then
            flutter create . --project-name anything_hub --org com.anything.hub --platforms=android
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Fix Groovy compatibility for Flutter SDK
        run: |
          # Parche dinámico para evitar el error de groovy.xml.QName en Gradle moderno con Java 17
          FLUTTER_GROOVY_FILE="$HOME/.pub-cache/hosted/pub.dartlang.org/... 2>/dev/null || find $RUNNER_TOOL_CACHE/flutter -name "flutter.groovy" | head -n 1"
          TARGET_FILE=$(find $RUNNER_TOOL_CACHE/flutter -name "flutter.groovy" | head -n 1)
          if [ -f "$TARGET_FILE" ]; then
            echo "Parcheando archivo: $TARGET_FILE"
            sed -i 's/import groovy.xml.QName//g' "$TARGET_FILE"
          fi

      - name: Build Split APKs Release
        run: flutter build apk --release --split-per-abi

      - name: Upload Split APK artifacts to Actions
        uses: actions/upload-artifact@v4
        with:
          name: app-release-abis
          path: build/app/outputs/flutter-apk/*.apk

      - name: Create GitHub Release and Upload APKs
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: build/app/outputs/flutter-apk/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
