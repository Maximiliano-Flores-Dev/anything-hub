name: anything_hub
description: "Un hub modular agéntico y web para Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/images/
    - assets/logo.png

flutter_launcher_icons:
  image_path: "assets/logo.png"
  android: true
  ios: false
  image_path_android: "assets/mylogo.png"
  
